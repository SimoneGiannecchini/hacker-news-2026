<main class="page">
  <section class="hero text-center">
    <span class="badge rounded-pill text-bg-warning mb-3">Hacker News</span>
    <h1>{{ title }}</h1>
    <p>Le ultime storie pubblicate su Hacker News, caricate 10 alla volta.</p>
  </section>

  <section class="container">
    <div *ngIf="error()" class="alert alert-danger mt-4" role="alert">
      {{ error() }}
    </div>

    <div class="row g-4 mt-2">
      <article *ngFor="let story of stories(); let i = index" class="col-12">
        <div class="news-card">
          <div class="news-number">
            {{ i + 1 }}
          </div>

          <div class="news-content">
            <h2>
              <a [href]="getStoryLink(story)" target="_blank" rel="noopener noreferrer">
                {{ story.title }}
              </a>
            </h2>

            <div class="news-meta">
              <span>{{ story.time * 1000 | date:'dd/MM/yyyy HH:mm' }}</span>
              <span *ngIf="story.by">di {{ story.by }}</span>
              <span *ngIf="story.score">{{ story.score }} punti</span>
            </div>

            <a class="news-link" [href]="getStoryLink(story)" target="_blank" rel="noopener noreferrer">
              {{ getStoryLink(story) }}
            </a>
          </div>
        </div>
      </article>
    </div>

    <div class="text-center my-5">
      <button
        class="btn btn-dark btn-lg px-5"
        type="button"
        (click)="loadMore()"
        [disabled]="loading() || !hasMore()"
      >
        <span *ngIf="!loading() && hasMore()">Load more</span>
        <span *ngIf="loading()">Caricamento...</span>
        <span *ngIf="!hasMore() && !loading()">Nessuna altra news</span>
      </button>
    </div>
  </section>
</main>
